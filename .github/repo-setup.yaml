# What agent skills set up in this repository, and the answers they were given.
# Agents: read this before setting the repo up again. Don't start over: confirm these answers
# still hold, run jq-repo-setup's scripts/check-setup.py, and fix only what it reports.
# Keep it true; update it when a decision changes.
schema: 1
setup:
  skill: jq-repo-setup
  date: 2026-11-21              # last full setup or review
  visibility: private            # assumed until the owner decides
  project_type: tool              # tool | library | app | saas-b2b
  team: solo                      # solo | team
  github_plan: free               # unconfirmed
  target: OSPS Baseline level 1 plus level 2 items suited to a private solo repo
  security_contact: the owner directly (see SECURITY.md); no address published
  decisions: docs/adr/            # where the reasons are written down
  skipped:
    - LICENSE: licence and visibility not decided by the owner yet
    - CODE_OF_CONDUCT: private repo, add if it goes public
    - OSPS-QA-07.01: solo maintainer, no second reviewer
    - public-only workflows (CodeQL, Scorecard, dependency review): repo assumed private
    - release signing and SBOM: nothing is released
