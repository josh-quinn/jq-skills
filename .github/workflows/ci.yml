name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (make check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and zsh
        run: |
          pipx install uv
          command -v zsh >/dev/null || sudo apt-get install -y --no-install-recommends zsh
      - name: Unit tests and skill checks (no network, no Docker)
        run: make check
