name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. **Security problems**: please report them privately instead (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The git commit of this repo, and which skill (jq-privacy-audit, jq-privacy-sandbox or jq-privacy-common)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, agent (Claude Code or Copilot CLI), Python and Docker versions
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: text
