# Public repos (or private with GitHub Code Security). Private without it: use Opengrep
# plus the language linters instead (references/tooling.md).
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, to pick up new queries

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # compiled languages (go, java-kotlin, c-cpp, csharp, swift) use autobuild or manual: add the
      # language's setup action here for manual. python, javascript-typescript, actions, ruby and
      # rust need no build: use none (autobuild is rejected for them).
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: LANGUAGES # e.g. go, python, javascript-typescript, actions
          build-mode: none # none | autobuild | manual, see the comment above
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
