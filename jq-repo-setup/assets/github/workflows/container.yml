# Container gates: Dockerfile lint, image build, vulnerability scan, SBOM.
# Tools run as digest-pinned images so no third-party action needs trusting. Refresh a
# digest with: docker buildx imagetools inspect aquasec/trivy:<tag>  (Dependabot's docker
# ecosystem does not read workflow files). Free on private repos; copy next to security.yml.
name: container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dockerfile:
    name: dockerfile (hadolint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile

  image:
    name: image (build, trivy, syft)
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ github.event.repository.name }} # via env, never inline in run: (injection)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag "$IMAGE":ci .
      - name: Trivy - fail on fixable HIGH or CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE":ci
      - name: Syft - SPDX SBOM of the image
        run: |
          mkdir sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" \
            anchore/syft:v1.57.1@sha256:03215d0e98b661d0ecbc8575dbc14d65be1743b5de5df6410aecb7e80f95b060 \
            "$IMAGE":ci -o spdx-json=/out/sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx
          path: sbom/sbom.spdx.json
          retention-days: 30
