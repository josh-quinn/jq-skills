name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. **Security problems**: please report them privately instead (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: <e.g. output of `tool --version`, or the app URL and date>
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: <OS, browser, runtime version>
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: text
